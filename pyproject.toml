[project]
name = "mcp-server-hubspot"
version = "0.2.0"
description = "A simple Hubspot MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26.0", "hubspot-api-client>=12.0.0", "python-dotenv>=1.2.2", "faiss-cpu>=1.13.2", "numpy>=2.4.2", "sentence-transformers>=5.2.3", "huggingface-hub>=1.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389"]

[project.scripts]
mcp-server-hubspot = "mcp_server_hubspot:run_main"
mcp-server-hubspot-contacts = "mcp_server_hubspot.server_contacts:run_main"
mcp-server-hubspot-deals = "mcp_server_hubspot.server_deals:run_main"